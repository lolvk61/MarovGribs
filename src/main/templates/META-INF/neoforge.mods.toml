displayName="${mod_name}"
logoFile="assets/marovgribs/icon.png"
logoBlur=false
displayURL="https://github.com/lolvk61/MarovGribs"
authors="Marov"
description='''
Грибы со способностями: растут в мире, дают эффекты, а у некоторых есть живые формы.
Mushrooms with abilities: they grow in the world, grant effects, and some of them walk.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
